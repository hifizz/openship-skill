name: Validate V0.2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile helpers and tests
        run: python -m compileall -q skills/openship/scripts tests

      - name: Run unit and structure tests
        run: python -m unittest discover -s tests -v

      - name: Check helper CLIs
        run: |
          python skills/openship/scripts/preflight.py --help >/dev/null
          python skills/openship/scripts/mcp_catalog.py --help >/dev/null
          python skills/openship/scripts/secret_exposure_preflight.py --help >/dev/null
          python skills/openship/scripts/log_leak_scan.py --help >/dev/null

      - name: Verify fail-closed build behavior
        run: |
          set +e
          python skills/openship/scripts/secret_exposure_preflight.py \
            --cwd . \
            --operation build \
            --remote-env-state unknown \
            --fail-closed >/tmp/secret-plan.json
          code=$?
          set -e
          test "$code" -eq 4
          python - <<'PY'
          import json
          data = json.load(open('/tmp/secret-plan.json', encoding='utf-8'))
          assert data['decision'] == 'blocked'
          assert data['touchesSensitiveData'] is True
          PY
