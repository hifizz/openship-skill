name: Check Openship upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare reviewed baseline with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          lock = json.loads(Path("upstream/openship.lock.json").read_text(encoding="utf-8"))
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "hifizz-openship-skill-upstream-check",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          release = get("https://api.github.com/repos/oblien/openship/releases/latest")
          commit = get("https://api.github.com/repos/oblien/openship/commits/main")
          latest_release = release["tag_name"]
          latest_commit = commit["sha"]

          lines = [
              "## Openship upstream check",
              "",
              f"- Reviewed release: `{lock['release']}`",
              f"- Latest release: `{latest_release}`",
              f"- Reviewed main commit: `{lock['mainCommit']}`",
              f"- Current main commit: `{latest_commit}`",
          ]
          if latest_commit != lock["mainCommit"]:
              lines.extend(["", "> Main has moved since review. Inspect source drift before changing references."])
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              Path(summary).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))

          if latest_release != lock["release"]:
              print("::error::A newer Openship release exists; review and update the skill baseline.")
              sys.exit(1)
          PY
